target_size: 50000
enforce_strict_1_to_1: true # <-- Add this switch
mock_mode: false         # Set to false to use real LLM API calls
api_key_path: /root/GenFragility-LLM/keys/openai.txt
cache_dir: /root/GenFragility-LLM/cache/llm_responses
seed:
  source: wikidata        # wikidata|manual|mixed
  batch_size: 12
concurrency:
  max_concurrent: 120
  batch_size: 32
thresholds:
  accept: 0.25            # 总分阈值 (进一步降低以支持大规模扩展)
  accept_if_closure: 0.20 # 能形成闭环则放宽
guards:
  per_head_caps:
    InstanceOf: 3
    LocatedIn: 3
    PartOf: 3
  global_ratio_max:
    LocatedIn: 0.15
    InstanceOf: 0.12
inverse:
  confidence_decay: 0.05
checkpoints:
  interval_nodes: 500
  dir: ./checkpoints/test_run_50k
exports:
  gexf: false  # Skip GEXF for now due to formatting issue
  pkl: true
  pkl_gz: true
  report_json: true